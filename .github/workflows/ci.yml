name: Zuvo CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Services & Resilience Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install Shared & Gateway Dependencies
        run: |
          cd backend
          npm ci --ignore-scripts || npm install
      - name: Run Backend & Circuit Breaker Tests
        run: |
          cd backend
          npm test

  web-build:
    name: Web Frontend Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Web/package.json
      - name: Install Web Dependencies
        run: |
          cd Web
          npm ci --ignore-scripts || npm install
      - name: Build Next.js Web App
        run: |
          cd Web
          npm run build

  mobile-check:
    name: Mobile App Typecheck (Expo / React Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MobileApp/ZuvoMobile/package.json
      - name: Install Mobile Dependencies
        run: |
          cd MobileApp/ZuvoMobile
          npm ci --ignore-scripts || npm install
      - name: Typecheck Mobile App
        run: |
          cd MobileApp/ZuvoMobile
          npx tsc --noEmit
